# Build and test everything on every push and pull request: the C++ library
# (Linux + macOS, plus a sanitizer build), C++ formatting, and the WebAssembly
# module with the npm package, docs site and web sandbox built on it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: C++ tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: ${{ runner.os == 'Linux' && 'sudo apt-get update && sudo apt-get install -y ninja-build' || 'brew install ninja' }}
      - run: cmake --preset native
      - run: cmake --build --preset native-release
      - run: ctest --preset native-release

  sanitizers:
    name: C++ tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build/sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - run: cmake --build build/sanitize
      - run: ctest --test-dir build/sanitize --output-on-failure

  format:
    name: C++ formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Pinned: clang-format's output changes between versions. Use the same
      # version locally (`pip install clang-format==21.1.8`).
      - run: pip install clang-format==21.1.8
      - name: clang-format --dry-run
        run: >
          find include src bindings sandbox/native tests
          \( -name '*.cpp' -o -name '*.hpp' \) -print0
          | xargs -0 clang-format --dry-run --Werror

  web:
    name: WASM, npm package, site and sandbox
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            js/package-lock.json
            site/package-lock.json
            sandbox/web/package-lock.json

      - name: Build the WASM module (publishes it into js/src/wasm)
        run: cmake --preset wasm && cmake --build --preset wasm-release

      - name: npm package — build and test
        working-directory: js
        run: npm ci && npm test
      - name: npm package — test on the oldest supported Node versions too
        working-directory: js
        run: |
          npx -y node@20 --test test/*.test.mjs
          npx -y node@22 --test test/*.test.mjs
      - name: npm package — check what would be published
        working-directory: js
        run: npm pack --dry-run

      - name: Docs site — format check and build
        working-directory: site
        run: npm ci && npm run format:check && npm run build
      - name: Web sandbox — format check and build
        working-directory: sandbox/web
        run: npm ci && npm run format:check && npm run build
